name: Build Android APK
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
      - name: Find and Build Gradle Project
        run: |
          # Yeh command khud dhoondhegi ki gradlew file kis folder mein hai
          GRADLEW_PATH=$(find . -name "gradlew" -print -quit)
          
          if [ -z "$GRADLEW_PATH" ]; then
            echo "Error: Poori repo mein kahi bhi gradlew file nahi mili bhae!"
            exit 1
          fi
          
          # Us folder ke andar jaao jahan gradlew mili hai
          PROJECT_DIR=$(dirname "$GRADLEW_PATH")
          cd "$PROJECT_DIR"
          
          # Build shuru karo
          chmod +x gradlew
          ./gradlew assembleDebug
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: "**/build/outputs/apk/debug/*.apk"
