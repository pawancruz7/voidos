name: Build Android APK
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build with Gradle
        run: |
          # 1. Pehle hum us sahi folder ke andar ghusenge jahan tumhara asli project hai
          if [ -d "voidos-main/launcher" ]; then
            cd voidos-main
          elif [ -d "launcher" ]; then
            echo "Launcher folder mil gaya!"
          else
            echo "Searching for project root..."
            SETTINGS_PATH=$(find . -name "settings.gradle" -print -quit)
            cd $(dirname "$SETTINGS_PATH")
          fi

          # 2. Permission fix karo aur build run karo
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: VoidOS-Launcher-APK
          path: "**/build/outputs/apk/debug/*.apk"
