name: Scan Project Structure
on: [push, workflow_dispatch]
jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: List All Files and Folders
        run: |
          echo "=== YAHAN DEKHO SAARI FILES KI LIST ==="
          find . -maxdepth 4 -not -path '*/.*'
