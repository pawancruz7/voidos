name: Build Android APK
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Ultimate Manual Build
        run: |
          echo "=== Step 1: Force Entering Sahi Folder ==="
          # Ab hum dhoondhenge nahi, seedha sahi folder ke andar entry maarenge
          if [ -d "launcher/src/main" ]; then
            cd launcher/src/main
          elif [ -d "voidos-main/launcher/src/main" ]; then
            cd voidos-main/launcher/src/main
          else
            # Agar folder ka naam thoda aage piche ho, toh fallback
            MANIFEST_PATH=$(find . -name "AndroidManifest.xml" -not -path "*/build/*" -not -path "*/.*" -print -quit)
            cd $(dirname "$MANIFEST_PATH")
          fi
          
          echo "Hamaari Current Location Hai: $(pwd)"

          echo "=== Step 2: Cleaning Hidden Windows Characters Inside Project ==="
          find . -depth -name "*"$'\r'"*" -exec sh -c 'for f; do mv "$f" "$(echo "$f" | tr -d "\r")"; done' _ {} +

          echo "=== Step 3: Compiling with Android Build Tools ==="
          SDK_DIR=$ANDROID_HOME
          BUILD_TOOLS_DIR=$(ls -d $SDK_DIR/build-tools/* | tail -1)
          PLATFORM_JAR=$(ls -d $SDK_DIR/platforms/android-*/android.jar | tail -1)

          echo "Using Tools from: $BUILD_TOOLS_DIR"

          mkdir -p obj bin

          # 1. Package Resources
          $BUILD_TOOLS_DIR/aapt package -f -m -J src -M AndroidManifest.xml -S res -I $PLATFORM_JAR -F bin/app-unsigned.apk || \
          ($BUILD_TOOLS_DIR/aapt2 compile --dir res -o compiled_res.zip && $BUILD_TOOLS_DIR/aapt2 link --manifest AndroidManifest.xml -I $PLATFORM_JAR -o bin/app-unsigned.apk compiled_res.zip)

          # 2. Compile Java Files
          if [ -d "java" ]; then
            find java -name "*.java" > sources.txt
          elif [ -d "src" ]; then
            find src -name "*.java" > sources.txt
          else
            find . -name "*.java" > sources.txt
          fi

          javac -source 1.8 -target 1.8 -d obj -classpath $PLATFORM_JAR @sources.txt || \
          javac -source 1.7 -target 1.7 -d obj -classpath $PLATFORM_JAR @sources.txt

          # 3. Dex Conversion (D8/DX)
          $BUILD_TOOLS_DIR/d8 --output bin/ obj/*.class 2>/dev/null || \
          $BUILD_TOOLS_DIR/dx --dex --output=bin/classes.dex obj

          # 4. Final Packaging & Signing
          cd bin
          if [ -f "classes.dex" ]; then
            zip -ur app-unsigned.apk classes.dex
          else
            zip -ur app-unsigned.apk *.dex
          fi

          keytool -genkey -v -keystore debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US" 2>/dev/null || true
          jarsigner -verbose -sigalg SHA1withRSA -digestalg SHA1 -keystore debug.keystore -storepass android app-unsigned.apk androiddebugkey

          mv app-unsigned.apk VoidOSLauncher.apk

      - name: Upload Generated APK
        uses: actions/upload-artifact@v4
        with:
          name: VoidOS-Launcher-APK
          path: |
            **/bin/VoidOSLauncher.apk
            **/VoidOSLauncher.apk
