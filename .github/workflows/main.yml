name: Build Android APK
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        
      - name: Build with System Gradle
        run: |
          # Agar gradlew nahi hai, toh hum system ka gradle use karenge
          # Yeh command khud dhoondhegi ki build.gradle file kis folder mein hai
          GRADLE_BUILD_PATH=$(find . -name "build.gradle" -print -quit)
          
          if [ -z "$GRADLE_BUILD_PATH" ]; then
            echo "Error: build.gradle file bhi nahi mili bhae!"
            exit 1
          fi
          
          PROJECT_DIR=$(dirname "$GRADLE_BUILD_PATH")
          cd "$PROJECT_DIR"
          
          # Direct system gradle se build
          gradle assembleDebug
          
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: "**/build/outputs/apk/debug/*.apk"
