name: Build Android APK
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Super Clean Copy and Manual Build
        run: |
          echo "=== Step 1: Navigating to Main Folder ==="
          if [ -d "launcher/src/main" ]; then
            cd launcher/src/main
          elif [ -d "voidos-main/launcher/src/main" ]; then
            cd voidos-main/launcher/src/main
          else
            MANIFEST_PATH=$(find . -name "AndroidManifest.xml" -not -path "*/build/*" -not -path "*/.*" -print -quit)
            cd $(dirname "$MANIFEST_PATH")
          fi
          
          echo "Hamaari Location Hai: $(pwd)"

          echo "=== Step 2: Creating a Fresh Clean Resource Folder ==="
          # Ek bilkul fresh folder banate hain bina kisi hidden Windows character ke
          mkdir -p clean_res/layout
          mkdir -p clean_res/values
          mkdir -p clean_res/drawable 2>/dev/null || true
          mkdir -p clean_res/mipmap-hdpi 2>/dev/null || true
          mkdir -p clean_res/mipmap-mdpi 2>/dev/null || true
          mkdir -p clean_res/mipmap-xhdpi 2>/dev/null || true
          mkdir -p clean_res/mipmap-xxhdpi 2>/dev/null || true
          mkdir -p clean_res/mipmap-xxxhdpi 2>/dev/null || true

          # Saari files ko fresh folder me copy karte hain ek-ek karke taaki kachra saaf ho jaye
          cp -r res/layout/* clean_res/layout/ 2>/dev/null || true
          cp -r res/values/* clean_res/values/ 2>/dev/null || true
          cp -r res/drawable*/* clean_res/drawable/ 2>/dev/null || true
          cp -r res/mipmap*/* clean_res/mipmap-hdpi/ 2>/dev/null || true

          # Python se naye folder ki ek-ek file ke andar ka text aur naam bilkul sanitize (saaf) karo
          python3 -c '
          import os
          for root, dirs, files in os.walk("clean_res"):
              for file in files:
                  fp = os.path.join(root, file)
                  # Content saaf karo
                  try:
                      with open(fp, "rb") as f: content = f.read()
                      clean = content.replace(b"\r\n", b"\n").replace(b"\r", b"")
                      with open(fp, "wb") as f: f.write(clean)
                  except: pass
                  # Naam saaf karo agar \r ho
                  if "\r" in file:
                      os.rename(fp, os.path.join(root, file.replace("\r", "")))
          '

          echo "=== Step 3: Compiling with Android Build Tools ==="
          SDK_DIR=$ANDROID_HOME
          BUILD_TOOLS_DIR=$(ls -d $SDK_DIR/build-tools/* | tail -1)
          PLATFORM_JAR=$(ls -d $SDK_DIR/platforms/android-*/android.jar | tail -1)

          mkdir -p obj bin

          # 1. Package Resources (Ab hum hamare naye 'clean_res' folder ka use karenge!)
          $BUILD_TOOLS_DIR/aapt package -f -m -J src -M AndroidManifest.xml -S clean_res -I $PLATFORM_JAR -F bin/app-unsigned.apk

          # 2. Compile Java Files
          find . -name "*.java" -not -path "*/clean_res/*" > sources.txt
          javac -source 1.8 -target 1.8 -d obj -classpath $PLATFORM_JAR @sources.txt

          # 3. Dex Conversion (D8/DX)
          $BUILD_TOOLS_DIR/d8 --output bin/ obj/*.class 2>/dev/null || \
          $BUILD_TOOLS_DIR/dx --dex --output=bin/classes.dex obj

          # 4. Final Packaging & Signing
          cd bin
          if [ -f "classes.dex" ]; then
            zip -ur app-unsigned.apk classes.dex
          else
            zip -ur app-unsigned.apk *.dex
          fi

          keytool -genkey -v -keystore debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US" 2>/dev/null || true
          jarsigner -verbose -sigalg SHA1withRSA -digestalg SHA1 -keystore debug.keystore -storepass android app-unsigned.apk androiddebugkey

          mv app-unsigned.apk VoidOSLauncher.apk

      - name: Upload Generated APK
        uses: actions/upload-artifact@v4
        with:
          name: VoidOS-Launcher-APK
          path: |
            **/bin/VoidOSLauncher.apk
            **/VoidOSLauncher.apk