name: Build Android APK with RealTime Engine
on: [push, workflow_dispatch]
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: God-Mode Native APK Compiler
        run: |
          set -e
          echo "=== Step 1: Enforcing Absolute Environment ==="
          WORKSPACE_ROOT="$GITHUB_WORKSPACE"
          cd "$WORKSPACE_ROOT"

          echo "=== Step 2: Purging All Residual Conflicts ==="
          find . -name "HomeActivity.java" -delete 2>/dev/null || true
          find . -name "EditorActivity.java" -delete 2>/dev/null || true
          find . -name "AndroidManifest.xml" -delete 2>/dev/null || true
          rm -rf res obj bin src output_apk final_out 2>/dev/null || true

          mkdir -p src/com/voidos/launcher
          mkdir -p res/layout res/values

          echo "=== Step 3: Injecting Full Structural System Manifest ==="
          cat << 'EOF' > AndroidManifest.xml
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android"
              package="com.voidos.launcher"
              android:versionCode="1"
              android:versionName="1.0">
              
              <uses-sdk android:minSdkVersion="29" android:targetSdkVersion="34" />
              
              <uses-feature android:name="android.software.home_screen" android:required="true" />

              <application
                  android:label="@string/app_name"
                  android:allowBackup="true"
                  android:testOnly="false"
                  android:hasCode="true"
                  android:extractNativeLibs="true"
                  android:theme="@android:style/Theme.NoTitleBar.Fullscreen">
                  
                  <activity
                      android:name="com.voidos.launcher.HomeActivity"
                      android:launchMode="singleInstance"
                      android:clearTaskOnLaunch="true"
                      android:stateNotNeeded="true"
                      android:exported="true">
                      <intent-filter android:priority="1000">
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.HOME" />
                          <category android:name="android.intent.category.DEFAULT" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
                  
                  <activity 
                      android:name="com.voidos.launcher.EditorActivity"
                      android:exported="true" />
              </application>
          </manifest>
          EOF

          cat << 'EOF' > res/values/strings.xml
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
              <string name="app_name">VoidOS Launcher</string>
          </resources>
          EOF

          cat << 'EOF' > res/layout/activity_home.xml
          <?xml version="1.0" encoding="utf-8"?>
          <RelativeLayout xmlns:android="http://schemas.android.com/apk/res/android"
              android:layout_width="match_parent"
              android:layout_height="match_parent"
              android:background="#000000">
              <GridView
                  android:id="@+id/apps_grid"
                  android:layout_width="match_parent"
                  android:layout_height="match_parent"
                  android:numColumns="4"
                  android:verticalSpacing="10dp"
                  android:horizontalSpacing="10dp"
                  android:stretchMode="columnWidth"
                  android:gravity="center" />
          </RelativeLayout>
          EOF

          cat << 'EOF' > res/layout/activity_editor.xml
          <?xml version="1.0" encoding="utf-8"?>
          <LinearLayout xmlns:android="http://schemas.android.com/apk/res/android"
              android:layout_width="match_parent"
              android:layout_height="match_parent"
              android:orientation="vertical"
              android:background="#121212"
              android:padding="16dp">
              <TextView
                  android:layout_width="wrap_content"
                  android:layout_height="wrap_content"
                  android:text="VoidOS Live Distro Script Editor"
                  android:textColor="#00FF00"
                  android:textSize="18sp"
                  android:textStyle="bold" />
              <EditText
                  android:id="@+id/code_input"
                  android:layout_width="match_parent"
                  android:layout_height="0dp"
                  android:layout_weight="1"
                  android:gravity="top|start"
                  android:background="#1E1E1E"
                  android:textColor="#00FF00"
                  android:fontFamily="monospace"
                  android:padding="12dp" />
              <Button
                  android:id="@+id/btn_apply"
                  android:layout_width="match_parent"
                  android:layout_height="wrap_content"
                  android:text="Flash Script Live ⚡" />
          </LinearLayout>
          EOF

          echo "=== Step 4: Injecting Cleaned Architecture Engine ==="
          cat << 'EOF' > src/com/voidos/launcher/EditorActivity.java
          package com.voidos.launcher;
          import android.content.Context;
          import android.content.SharedPreferences;
          import android.os.Bundle;
          import android.widget.Button;
          import android.widget.EditText;
          import android.app.Activity;
          
          public class EditorActivity extends Activity {
              @Override
              protected void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);
                  setContentView(R.layout.activity_editor);
                  EditText input = findViewById(R.id.code_input);
                  Button btn = findViewById(R.id.btn_apply);
                  SharedPreferences prefs = getSharedPreferences("VoidOS_Prefs", Context.MODE_PRIVATE);
                  input.setText(prefs.getString("custom_js", ""));
                  btn.setOnClickListener(v -> {
                      prefs.edit().putString("custom_js", input.getText().toString()).apply();
                      if (HomeActivity.instance != null) {
                          HomeActivity.instance.executeConfigCode(input.getText().toString());
                      }
                      finish();
                  });
              }
          }
          EOF
          
          cat << 'EOF' > src/com/voidos/launcher/HomeActivity.java
          package com.voidos.launcher;
          import android.os.Bundle;
          import android.widget.GridView;
          import android.widget.Toast;
          import android.app.Activity;
          
          public class HomeActivity extends Activity {
              public static HomeActivity instance;
              private android.webkit.WebView jsEngine;
          
              @Override
              protected void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);
                  setContentView(R.layout.activity_home);
                  instance = this;
                  jsEngine = new android.webkit.WebView(this);
                  jsEngine.getSettings().setJavaScriptEnabled(true);
                  jsEngine.addJavascriptInterface(new VoidOSBridge(), "voidOS");
              }
          
              public void executeConfigCode(final String jsScript) {
                  runOnUiThread(() -> jsEngine.evaluateJavascript(jsScript, null));
              }
          
              public class VoidOSBridge {
                  @android.webkit.JavascriptInterface
                  public void setBgColor(final String hexColor) {
                      runOnUiThread(() -> {
                          try {
                              findViewById(android.R.id.content).setBackgroundColor(android.graphics.Color.parseColor(hexColor));
                          } catch(Exception e) {
                              e.printStackTrace();
                          }
                      });
                  }
              }
          }
          EOF

          echo "=== Step 5: Resolving Paths ==="
          SDK_DIR="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          BUILD_TOOLS_DIR=$(ls -d $SDK_DIR/build-tools/* | grep -v "rc" | tail -1)
          PLATFORM_JAR=$(ls -d $SDK_DIR/platforms/android-*/android.jar | tail -1)

          mkdir -p obj bin

          echo "=== Step 6: AAPT Compilation ==="
          $BUILD_TOOLS_DIR/aapt package -f -m -J src -M AndroidManifest.xml -S res -I "$PLATFORM_JAR" -F bin/app-unsigned.apk

          echo "=== Step 7: Java Compile Enforcements ==="
          find src -name "*.java" > sources.txt
          javac -encoding UTF-8 -source 1.8 -target 1.8 -d obj -classpath "$PLATFORM_JAR" @sources.txt

          echo "=== Step 8: D8 Dex Execution ==="
          $BUILD_TOOLS_DIR/d8 --lib "$PLATFORM_JAR" --output bin/ obj/com/voidos/launcher/*.class

          echo "=== Step 9: Zip File Packaging ==="
          cd bin
          zip -ur app-unsigned.apk classes.dex

          echo "=== Step 10: ZipAlign Layout and Security Encryption Blocks ==="
          $BUILD_TOOLS_DIR/zipalign -v -f 4 app-unsigned.apk app-aligned.apk

          keytool -genkey -v -keystore debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US" 2>/dev/null || true
          
          mkdir -p "$WORKSPACE_ROOT/final_out"
          $BUILD_TOOLS_DIR/apksigner sign --ks debug.keystore --ks-pass pass:android --out "$WORKSPACE_ROOT/final_out/VoidOSLauncher.apk" app-aligned.apk
          
          echo "=== GOD-MODE PROCESS COMPLETELY STABILIZED ==="

      - name: Deploy Direct GitHub Infrastructure Release Link 🌐
        uses: softprops/action-gh-release@v2
        with:
          tag_name: "v1.0.${{ github.run_number }}"
          name: "VoidOS Launcher Release Build #${{ github.run_number }}"
          files: final_out/VoidOSLauncher.apk
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          
