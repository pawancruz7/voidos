name: Build Android APK with RealTime Engine
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Auto-Sanitize and Inject GodMode Files
        run: |
          echo "=== Step 1: Finding Main Source Folder ==="
          if [ -d "launcher/src/main" ]; then
            BASE_DIR="launcher/src/main"
          elif [ -d "voidos-main/launcher/src/main" ]; then
            BASE_DIR="voidos-main/launcher/src/main"
          else
            MANIFEST_PATH=$(find . -name "AndroidManifest.xml" -not -path "*/build/*" -not -path "*/.*" -print -quit)
            BASE_DIR=$(dirname "$MANIFEST_PATH")
          fi
          
          echo "Hamaari Main Location Hai: $BASE_DIR"

          echo "=== Step 2: Global Filename & Content Sanitizer ==="
          python3 -c "
          import os
          for root, dirs, files in os.walk('$BASE_DIR/res'):
              for file in files:
                  fp = os.path.join(root, file)
                  try:
                      with open(fp, 'rb') as f: content = f.read()
                      clean = content.replace(b'\r\n', b'\n').replace(b'\r', b'')
                      with open(fp, 'wb') as f: f.write(clean)
                  except: pass
                  clean_name = ''.join([c for c in file if c.isalnum() or c in '._-'])
                  if clean_name != file:
                      os.rename(fp, os.path.join(root, clean_name))
          "

          echo "=== Step 3: Auto Creating RealTime Distro Layouts ==="
          mkdir -p $BASE_DIR/res/layout
          cat << 'EOF' > $BASE_DIR/res/layout/activity_editor.xml
          <?xml version="1.0" encoding="utf-8"?>
          <LinearLayout xmlns:android="http://schemas.android.com/apk/res/android"
              android:layout_width="match_parent"
              android:layout_height="match_parent"
              android:orientation="vertical"
              android:background="#121212"
              android:padding="16dp">
              <TextView
                  android:layout_width="wrap_content"
                  android:layout_height="wrap_content"
                  android:text="VoidOS Live Distro Script Editor"
                  android:textColor="#00FF00"
                  android:textSize="18sp"
                  android:layout_marginBottom="4dp"
                  android:textStyle="bold" />
              <TextView
                  android:layout_width="wrap_content"
                  android:layout_height="wrap_content"
                  android:text="⚠️ Warning: Galat code se UI freeze ho sakti hai, par Crash nahi hoga."
                  android:textColor="#FFA500"
                  android:textSize="12sp"
                  android:layout_marginBottom="8dp" />
              <EditText
                  android:id="@+id/code_input"
                  android:layout_width="match_parent"
                  android:layout_height="0dp"
                  android:layout_weight="1"
                  android:gravity="top|start"
                  android:background="#1E1E1E"
                  android:textColor="#00FF00"
                  android:fontFamily="monospace"
                  android:hint="// Example:\n// voidOS.setBgColor('#FF0000');\n// voidOS.setGridColumns(5);"
                  android:textColorHint="#555555"
                  android:padding="12dp"
                  android:scrollbars="vertical" />
              <Button
                  android:id="@+id/btn_apply"
                  android:layout_width="match_parent"
                  android:layout_height="wrap_content"
                  android:layout_marginTop="12dp"
                  android:text="Flash Script Live ⚡"
                  android:backgroundTint="#007ACC"
                  android:textColor="#FFFFFF" />
          </LinearLayout>
          EOF

          echo "=== Step 4: Auto Injecting Java Engine Classes ==="
          JAVA_DIR=$(find . -name "HomeActivity.java" -exec dirname {} \; -print -quit)
          
          cat << 'EOF' > $JAVA_DIR/EditorActivity.java
          package com.voidos.launcher;
          import android.content.Context;
          import android.content.SharedPreferences;
          import android.os.Bundle;
          import android.view.View;
          import android.widget.Button;
          import android.widget.EditText;
          import androidx.appcompat.app.AppCompatActivity;

          public class EditorActivity extends AppCompatActivity {
              private EditText codeInput;
              private Button btnApply;
              private SharedPreferences sharedPreferences;

              @Override
              protected void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);
                  setContentView(R.layout.activity_editor);
                  codeInput = findViewById(R.id.code_input);
                  btnApply = findViewById(R.id.btn_apply);
                  sharedPreferences = getSharedPreferences("VoidOS_Prefs", Context.MODE_PRIVATE);
                  String savedCode = sharedPreferences.getString("custom_js", "");
                  codeInput.setText(savedCode);
                  btnApply.setOnClickListener(v -> {
                      String currentCode = codeInput.getText().toString();
                      sharedPreferences.edit().putString("custom_js", currentCode).apply();
                      if (HomeActivity.instance != null) {
                          HomeActivity.instance.executeConfigCode(currentCode);
                      }
                      finish();
                  });
              }
          }
          EOF

          cat << 'EOF' > $JAVA_DIR/HomeActivity.java
          package com.voidos.launcher;
          import android.os.Bundle;
          import android.widget.GridView;
          import android.widget.Toast;
          import androidx.appcompat.app.AppCompatActivity;

          public class HomeActivity extends AppCompatActivity {
              public static HomeActivity instance;
              private android.webkit.WebView jsEngine;
              private GridView appsGrid;

              @Override
              protected void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);
                  setContentView(R.layout.activity_home);
                  
                  instance = this;
                  appsGrid = findViewById(R.id.apps_grid);

                  jsEngine = new android.webkit.WebView(this);
                  jsEngine.getSettings().setJavaScriptEnabled(true);
                  jsEngine.addJavascriptInterface(new VoidOSBridge(), "voidOS");

                  jsEngine.setWebChromeClient(new android.webkit.WebChromeClient() {
                      @Override
                      public boolean onConsoleMessage(android.webkit.ConsoleMessage consoleMessage) {
                          if (consoleMessage.messageLevel() == android.webkit.ConsoleMessage.MessageLevel.ERROR) {
                              String errorMsg = "🔴 Script Error: " + consoleMessage.message() + " at line " + consoleMessage.lineNumber();
                              showLiveError(errorMsg);
                          }
                          return true;
                      }
                  });

                  android.content.SharedPreferences prefs = getSharedPreferences("VoidOS_Prefs", MODE_PRIVATE);
                  String savedCode = prefs.getString("custom_js", "");
                  if (!savedCode.isEmpty()) {
                      executeConfigCode(savedCode);
                  }
              }

              public void executeConfigCode(final String jsScript) {
                  runOnUiThread(() -> {
                      String safeWrappedCode = "try { " + jsScript + " } catch(err) { console.error(err.message); }";
                      jsEngine.evaluateJavascript(safeWrappedCode, null);
                  });
              }

              private void showLiveError(final String msg) {
                  runOnUiThread(() -> Toast.makeText(HomeActivity.this, msg, Toast.LENGTH_LONG).show());
              }

              public class VoidOSBridge {
                  @android.webkit.JavascriptInterface
                  public void setBgColor(final String hexColor) {
                      runOnUiThread(() -> {
                          try {
                              if(hexColor.startsWith("#") && (hexColor.length() == 7 || hexColor.length() == 9)) {
                                  findViewById(android.R.id.content).setBackgroundColor(android.graphics.Color.parseColor(hexColor));
                              } else {
                                  showLiveError("⚠️ Galat Color Code");
                              }
                          } catch (Exception e) {
                              showLiveError("⚠️ Invalid Color");
                          }
                      });
                  }

                  @android.webkit.JavascriptInterface
                  public void setGridColumns(final int columns) {
                      runOnUiThread(() -> {
                          if (columns <= 0 || columns > 10) {
                              showLiveError("⚠️ Limit Alert: 1 se 10 tak!");
                          } else if (appsGrid != null) {
                              appsGrid.setNumColumns(columns);
                          }
                      });
                  }
              }
          }
          EOF

      - name: Build with Gradle (Automated Standard Mode)
        run: |
          chmod +x gradlew 2>/dev/null || true
          ./gradlew assembleDebug --stacktrace || true
          
          # Agar project root me gradlew na ho toh subfolder me check karo
          if [ ! -f "VoidOSLauncher.apk" ]; then
            find . -name "*.apk" -exec mv {} ./VoidOSLauncher.apk \;
          fi

      - name: Upload Generated APK
        uses: actions/upload-artifact@v4
        with:
          name: VoidOS-Launcher-APK
          path: |
            **/VoidOSLauncher.apk
            **/build/outputs/apk/debug/*.apk
